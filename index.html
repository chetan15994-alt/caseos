<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaseOS · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F9; --surface:#FFFFFF; --border:#E2E8EB; --ink:#10232E; --muted:#5E6B73;
  --teal:#1F7A73; --tint:#E1F0EE; --hover:#F0F4F5; --chip:#EEF2F4;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sb:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
svg text{font-family:var(--sans)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
#app{display:grid;grid-template-columns:var(--sb) 1fr;height:100vh;transition:grid-template-columns .2s}
#app.collapsed{--sb:64px}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border)}
.logo{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:15px;height:15px}
.wordmark{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
.nav{padding:12px 10px 4px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);text-align:left;white-space:nowrap}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--tint);color:var(--teal);font-weight:500}
.nav .count{margin-left:auto;font-size:12px;background:var(--chip);color:var(--ink);border-radius:10px;padding:0 7px}
.sb-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border)}
.userbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;text-align:left}
.userbtn:hover{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.teal{background:var(--teal)}
.who b{display:block;font-weight:500;font-size:13px;white-space:nowrap}
.who span{font-size:12px;color:var(--muted);white-space:nowrap}
#app.collapsed .wordmark,#app.collapsed .nav span.lbl,#app.collapsed .nav .count,#app.collapsed .who{display:none}
#app.collapsed .nav button{justify-content:center}
.rolemenu{position:absolute;bottom:64px;left:10px;width:236px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(16,35,46,.12);padding:6px;z-index:40}
.rolemenu .h{font-size:12px;color:var(--muted);padding:6px 8px}
.rolemenu button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;text-align:left}
.rolemenu button:hover{background:var(--hover)}
.rolemenu button.on{background:var(--tint)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.search{flex:1;max-width:420px;min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;color:var(--muted);background:var(--bg);text-align:left}
.search:hover{border-color:#cfd8dc}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;background:#fff}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sw{width:32px;height:18px;border-radius:9px;background:#CBD5DA;position:relative;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--teal)}
.sw.on::after{left:16px}
.badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--teal);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.content{flex:1;overflow:auto;padding:24px 28px 120px}

/* generic */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#1a6a64}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--chip);font-size:12px;font-weight:500;white-space:nowrap}
.chip.teal{background:var(--tint);color:var(--teal)}
.chip.line{background:transparent;border:1px solid var(--border);color:var(--muted)}
.chip svg.i{width:13px;height:13px}
.phase{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px dashed var(--teal);color:var(--teal);border-radius:6px;font-size:11px;font-weight:500;margin-left:8px;vertical-align:middle;white-space:nowrap;background:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.pagehead h1{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:-.01em;line-height:1.15}
.pagehead p{color:var(--muted);margin-top:4px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.s2{background:var(--teal);border:1.5px solid var(--teal)}
.dot.s1{background:var(--tint);border:1.5px solid var(--teal)}
.dot.s0{background:#fff;border:1.5px solid #B9C3C8}
.alert{color:var(--ink)}

/* pipeline */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{padding:14px 16px}
.metric .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.metric .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.fchip{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--muted)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fsel{height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;background:var(--surface);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;align-items:start}
.col{background:#EEF2F4;border-radius:10px;padding:10px;min-height:420px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-weight:600;font-size:13px}
.colh span{color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left;transition:border-color .15s}
.kcard:hover{border-color:#b9c7cc}
.kcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kcard .nm{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.2}
.kcard .st{font-size:12.5px;color:var(--muted);margin-top:8px}
.kcard .meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.kcard.risk{border-color:#9FB0B8}
.kcard.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--teal)}100%{box-shadow:0 0 0 0 rgba(31,122,115,0)}}

/* case page */
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:14px}
.crumb button{color:var(--muted)}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.casehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.casehead h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.casehead .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.owner{text-align:right;font-size:13px}
.owner b{font-weight:600}
.tracker{display:flex;align-items:center;margin:4px 0 22px;padding:16px 20px}
.tstep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.tstep .c{width:20px;height:20px;border-radius:50%;border:1.5px solid #B9C3C8;background:#fff;display:grid;place-items:center}
.tstep.done .c{background:var(--teal);border-color:var(--teal);color:#fff}
.tstep.done .c svg{width:12px;height:12px;stroke-width:3}
.tstep.cur{color:var(--ink);font-weight:600}
.tstep.cur .c{border:6px solid var(--ink)}
.tline{flex:1;height:1.5px;background:var(--border);margin:0 12px;min-width:20px}
.tline.done{background:var(--teal)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0;padding:0 8px}
.tabs button{padding:12px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.tabs button:hover{color:var(--ink)}
.tabbody{padding:6px 0 10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border);background:#FAFBFC}
td{padding:12px 16px;border-bottom:1px solid #EDF1F3;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#FAFBFC}
tr.dim td{color:var(--muted)}
.cname{display:flex;align-items:center;gap:8px;font-weight:500}
.chev{transition:transform .15s;color:var(--muted)}
.chev.open{transform:rotate(90deg)}
.strength{display:flex;align-items:center;gap:8px}
.status{font-weight:500}
.status.ok{color:var(--teal)}
.status.warn{color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.evid{background:#FAFBFC}
.evid td{padding:4px 16px 14px 44px}
.evlist{display:flex;flex-direction:column;gap:6px}
.evitem{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:6px;font-size:13px}
.evitem .src{margin-left:auto;color:var(--muted);font-size:12px}
.linkbtn{color:var(--teal);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{text-decoration:underline}
.comment{margin-top:8px;padding:8px 10px;border-left:2px solid var(--ink);background:var(--chip);font-size:13px;border-radius:0 6px 6px 0}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.rcard{padding:16px}
.rcard h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.check{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid #B9C3C8;display:grid;place-items:center;flex:none;background:#fff}
.box.on{background:var(--teal);border-color:var(--teal);color:#fff}
.box svg{width:12px;height:12px;stroke-width:3}
.check.done{color:var(--muted)}
.agentid{width:24px;height:24px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.agentid svg{width:14px;height:14px}
.sug{border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px;background:#fff}
.sug.new{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sug h4{font-size:13.5px;font-weight:600;line-height:1.35}
.sug p{font-size:13px;color:var(--muted);margin-top:4px}
.sug .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug .acts{display:flex;gap:6px;margin-top:12px}
.sug.done{background:#FAFBFC}
.sug.done h4{font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.banner{display:flex;align-items:center;gap:18px;padding:16px 20px;margin-bottom:18px;border:1px solid var(--ink);border-radius:10px;background:#fff}
.ring{width:54px;height:54px;flex:none}
.banner h3{font-size:15px;font-weight:600}
.reqs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.req{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px}
.req .map{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.sel{height:28px;border:1px solid var(--border);border-radius:6px;padding:0 6px;font-size:12.5px;background:#fff}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,35,46,.28);display:grid;place-items:center;z-index:60;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:760px;max-width:calc(100vw - 32px);max-height:calc(100vh - 64px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(16,35,46,.22);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh h2{font-size:16px;font-weight:600}
.mh .x{margin-left:auto}
.mb{padding:18px 20px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:#FAFBFC;border-radius:0 0 12px 12px}
.drop{border:1.5px dashed #B9C3C8;border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.drop b{color:var(--ink);font-weight:500}
.files{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.steps{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.stp{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.stp.done{color:var(--ink)}
.stp .sp{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--teal);animation:spin .7s linear infinite;flex:none}
.stp .ok{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.stp .ok svg{width:11px;height:11px;stroke-width:3}
.stp .wait{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.textarea{width:100%;min-height:170px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5;resize:vertical}
.field{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid #EDF1F3}
.field span{color:var(--muted);width:60px}
.lineage{display:flex;flex-direction:column;gap:0}
.lstep{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.lstep:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--border)}
.lstep .n{width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--teal);font-size:11px;font-weight:600;display:grid;place-items:center}
.lstep b{display:block;font-size:12.5px;color:var(--muted);font-weight:500}

/* command bar */
.cmd{position:fixed;inset:0;background:rgba(16,35,46,.22);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmdbox{width:620px;max-width:calc(100vw - 32px);background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(16,35,46,.22);overflow:hidden}
.cmdbox input{width:100%;border:none;border-bottom:1px solid var(--border);padding:16px 18px;font-size:15px;outline:none}
.cmdsec{padding:8px}
.cmdsec .h{font-size:12px;color:var(--muted);padding:6px 10px}
.cmdsec button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:6px}
.cmdsec button:hover,.cmdsec button.act{background:var(--hover)}
.answer{padding:14px 18px 18px;border-top:1px solid var(--border);font-size:14px;line-height:1.6}
.answer .srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* popovers, toast, guide */
.pop{position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(16,35,46,.14);z-index:50}
.notif{width:340px;top:52px;right:150px;padding:6px}
.notif .h{font-size:12px;color:var(--muted);padding:8px 10px}
.notif button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:6px;font-size:13px}
.notif button:hover{background:var(--hover)}
.notif small{display:block;color:var(--muted);font-size:12px}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;display:flex;gap:8px;align-items:center;animation:rise .25s ease;box-shadow:0 8px 24px rgba(16,35,46,.25)}
.guide{margin:6px 10px 10px;padding:12px 12px;background:#FAFBFC}
#app.collapsed .guide{display:none}
.guide .gh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.guide ol{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.guide li{display:flex;gap:8px;font-size:12.5px;align-items:flex-start;line-height:1.35}
.guide li.done{color:var(--muted);text-decoration:line-through}
.guide .foot{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
.guide.min{width:auto}
.guide.min ol,.guide.min .foot{display:none}

/* insights */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.igroup{padding:18px}
.igroup h3{font-size:14px;font-weight:600}
.igroup .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.kpi{padding:12px 0;border-top:1px solid #EDF1F3}
.kpi .v{font-family:var(--serif);font-size:24px;font-weight:600}
.kpi .l{font-size:12.5px;color:var(--muted)}

/* client */
.portal{max-width:760px;margin:0 auto}
.pstatus{padding:22px;margin-bottom:16px}
.pbar{display:flex;gap:6px;margin-top:16px}
.pbar div{flex:1;height:6px;border-radius:3px;background:var(--chip)}
.pbar div.on{background:var(--teal)}
.plabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.plist{padding:6px 0}
.pitem{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #EDF1F3}
.pitem:first-child{border-top:none}
.pitem .t{flex:1}
.note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:14px}
.queue .item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid #EDF1F3;width:100%;text-align:left}
.queue .item:first-child{border-top:none}
.queue .item:hover{background:#FAFBFC}

<body>
<div id="app"></div>
<div id="layer"></div>

<script>
/* ---------------- icons ---------------- */
const P={

 chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',

 spark:'<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
 alert:'<circle cx="12" cy="12" r="9.5"/><line x1="12" y1="7.5" x2="12" y2="12.5"/><line x1="12" y1="16.3" x2="12.01" y2="16.3"/>',
 check:'<polyline points="20 6 9 17 4 12"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',

 chevR:'<polyline points="9 18 15 12 9 6"/>',
 chevD:'<polyline points="6 9 12 15 18 9"/>',
 x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
 reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
 panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
 clock:'<circle cx="12" cy="12" r="9.5"/><polyline points="12 7 12 12 15.5 14"/>',
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 branch:'<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
 list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
 send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
 folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
 scale:'<path d="M12 3v18"/><path d="M5 21h14"/><path d="m3 13 3-7 3 7a3.5 3.5 0 0 1-6 0z"/><path d="m15 13 3-7 3 7a3.5 3.5 0 0 1-6 0z"/><path d="M6 6h12"/>'
};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- reference data ---------------- */
const STAFF={AR:['Arjun Reddy','Intake'],JM:['Jay Mehta','Intake'],MC:['Mei Chen','Case specialist'],SP:['Sam Park','Case specialist'],DB:['Diana Bose','Attorney'],FL:['Felix Lang','Filing'],RK:['Rhea Kapoor','Operations lead'],PS:['Priya Sharma','Client']};
const ROLES={mei:'MC',diana:'DB',ops:'RK',client:'PS'};
const STAGES=[['intake','Intake'],['build','Case build'],['review','Attorney review'],['filing','Filing'],['rfe','RFE']];
const TRACK=['Intake','Case build','Attorney review','Filing','Decision'];
const SETS={
 EB1A:{rule:'Claim at least 3 of 10',list:[['awards','Awards'],['membership','Membership in associations'],['published','Published material about the person'],['judging','Judging the work of others'],['original','Original contributions of major significance'],['scholarly','Scholarly articles'],['exhibitions','Exhibitions or showcases'],['leading','Leading or critical role'],['salary','High salary'],['commercial','Commercial success in the performing arts']]},
 'O-1A':{rule:'Claim at least 3 of 8',list:[['awards','Awards'],['membership','Membership'],['published','Published material'],['judging','Judging'],['original','Original contributions'],['scholarly','Scholarly articles'],['critical','Critical or essential employment'],['remuneration','High remuneration']]},
 'EB2-NIW':{rule:'Meet all 3 prongs',list:[['merit','Substantial merit and national importance'],['positioned','Well positioned to advance the endeavor'],['balance','On balance, waiving the job offer benefits the US']]}
};
const PHASES={1:'Phase 1 · MVP',2:'Phase 2',3:'Phase 3',4:'Phase 4',5:'Phase 5'};

function lin(src,ext,sug,by){return{src,ext,sug,by}}
function docs(names,crit,by='Arjun Reddy · Sep 12'){return names.map(n=>({name:n,lineage:lin('Client portal upload',`Document type detected; key fields extracted from ${n.replace(/_/g,' ').replace(/\.\w+$/,'')}`,`${crit} · High 95%`,by)}))}
function crit(visa,claims){
  return SETS[visa].list.map(([k,n])=>{const c=claims[k];return c?{key:k,name:n,claimed:true,strength:c[0],status:c[1],docs:c[2]||[],comment:null}:{key:k,name:n,claimed:false,strength:0,status:'Not claimed',docs:[],comment:null}});
}
function genDocs(prefix,n,critName){return Array.from({length:n},(_,i)=>`${prefix}_${String(i+1).padStart(2,'0')}.pdf`).map(x=>docs([x],critName)[0])}

function seed(){
  const cases=[
    {id:'aisha',name:'Aisha Khan',visa:'O-1A',stage:'intake',owner:'AR',status:'Documents 4 of 9 received',days:3},
    {id:'tomas',name:'Tomás Ruiz',visa:'EB2-NIW',stage:'intake',owner:'AR',status:'Strategy call Thursday',days:1},
    {id:'wei',name:'Wei Lin',visa:'EB1A',stage:'intake',owner:'JM',status:'Documents 7 of 9 received',days:2},
    {id:'priya',name:'Priya Sharma',visa:'EB1A',stage:'build',owner:'MC',status:'Letters 3 of 4 signed',days:5,premium:true,next:'Attorney review, due Oct 9'},
    {id:'daniel',name:'Daniel Okafor',visa:'O-1A',stage:'build',owner:'MC',status:'Waiting on 2 letters',days:6,risk:'Over time limit'},
    {id:'lena',name:'Lena Fischer',visa:'EB2-NIW',stage:'build',owner:'SP',status:'Drafting petition',days:2},
    {id:'omar',name:'Omar Haddad',visa:'EB1A',stage:'review',owner:'DB',status:'Review due in 2 days',days:3},
    {id:'sofia',name:'Sofia Martins',visa:'O-1A',stage:'review',owner:'DB',status:'Changes requested',days:1},
    {id:'ken',name:'Ken Tanaka',visa:'EB2-NIW',stage:'filing',owner:'FL',status:'Receipt pending',days:2},
    {id:'mia',name:'Mia Brown',visa:'EB1A',stage:'filing',owner:'FL',status:'Filed Sep 22',days:4},
    {id:'ravi',name:'Ravi Patel',visa:'EB1A',stage:'rfe',owner:'MC',status:'Response due Oct 15',days:68,risk:'Deadline close'},
    {id:'julia',name:'Julia Nowak',visa:'O-1A',stage:'rfe',owner:'SP',status:'Response due Nov 26',days:25}
  ];
  const generic={
    'EB1A':{judging:[2,'Ready'],original:[2,'Ready'],scholarly:[2,'Ready'],leading:[1,'Ready']},
    'O-1A':{judging:[2,'Ready'],original:[1,'Ready'],critical:[2,'Ready'],remuneration:[1,'In progress']},
    'EB2-NIW':{merit:[2,'Ready'],positioned:[1,'In progress'],balance:[1,'In progress']}
  };
  cases.forEach(c=>{
    const g=generic[c.visa];const claims={};
    Object.entries(g).forEach(([k,v])=>{const nm=SETS[c.visa].list.find(x=>x[0]===k)[1];claims[k]=[v[0],v[1],genDocs(k[0].toUpperCase()+k.slice(1),3+(k.length%4),nm)]});
    if(c.stage==='intake'){Object.values(claims).forEach(v=>{v[1]='Collecting evidence';v[0]=Math.min(v[0],1)})}
    c.criteria=crit(c.visa,claims);c.letters=[];c.activity=[{t:'Sep 24, 16:05',who:STAFF[c.owner][0],what:'Updated case status'}];
    c.review={};c.tasks=[];c.identity=[];c.needsReview=[];c.requests=[];c.feed=[];c.exhibits=false;
  });
  const p=cases.find(c=>c.id==='priya');
  p.criteria=crit('EB1A',{
    judging:[2,'Ready',docs(['IEEE_reviewer_invitation_2024.pdf','NeurIPS_program_committee.pdf','Journal_review_record.pdf','Hackathon_judge_certificate.pdf'],'Judging the work of others')],
    original:[1,'Needs 1 letter',docs(['Patent_adaptive_grid_forecasting.pdf','Google_Scholar_citation_report.pdf','Adoption_letter_GridCo.pdf'],'Original contributions')],
    scholarly:[2,'Ready',genDocs('Paper',12,'Scholarly articles')],
    leading:[0,'Gap: add evidence',docs(['Offer_letter_Acme_Robotics.pdf'],'Leading or critical role')]
  });
  p.letters=[
    {name:'Dr. A. Rao',rel:'Co-author, Stanford',crit:'Scholarly articles',status:'Signed'},
    {name:'Prof. J. Kim',rel:'Editor, IEEE Transactions',crit:'Judging the work of others',status:'Signed'},
    {name:'M. Ortiz',rel:'VP Engineering, GridCo',crit:'Original contributions',status:'Signed'},
    {name:'Dr. L. Brooks',rel:'Independent expert, MIT',crit:'Original contributions',status:'Draft sent 6 days ago'}
  ];
  p.identity=[{name:'Birth_certificate_translated.pdf'}];
  p.activity=[
    {t:'Sep 20, 14:12',who:'Mei Chen',what:'Sent letter draft to Dr. L. Brooks'},
    {t:'Sep 18, 09:40',who:'Case agent',what:'Mapped 12 publications to Scholarly articles (approved by Mei Chen)'},
    {t:'Sep 12, 11:20',who:'Arjun Reddy',what:'Handed off to Case build with 4 criteria claimed'}
  ];
  p.feed=[
    {id:'gap',state:'open',title:'Leading or critical role is the weakest criterion',body:'It has one item, an offer letter, which shows the job but not its importance. An org chart and a letter from the CTO at Acme Robotics would show the role’s scope.',conf:'High · 89%',srcs:['Offer_letter_Acme_Robotics.pdf, p.1'],primary:'Request from Priya'},
    {id:'brooks',state:'open',title:'Dr. L. Brooks hasn’t signed in 6 days',body:'Original contributions needs this letter to be ready. I drafted a short, polite follow-up for you to review.',conf:'Draft',srcs:['Letters tracker','Email sent Sep 20'],primary:'Review draft'}
  ];
  const r=cases.find(c=>c.id==='ravi');
  r.rfe={received:'Jul 20',due:'Oct 15',left:19,total:87,reopened:false,requests:[
    {text:'Show that the patented forecasting method has had major significance in the field, beyond citation counts.',page:2,crit:'original'},
    {text:'Show that Helix Energy, where the beneficiary led the platform team, has a distinguished reputation.',page:3,crit:'leading'}]};
  const j=cases.find(c=>c.id==='julia');
  j.rfe={received:'Sep 1',due:'Nov 26',left:61,total:87,reopened:true,requests:[{text:'Provide evidence that published material about the beneficiary appeared in major media.',page:2,crit:'judging'}]};
  j.criteria.forEach(x=>{if(x.claimed)x.status=x.key==='judging'?'Reopened':'Not challenged'});
  return {role:'mei',view:{name:'pipeline'},filter:'all',visa:'all',phases:false,collapsed:false,cases,
    notes:[{id:1,text:'Daniel Okafor is over the 5-day time limit in Case build',case:'daniel',read:false},{id:2,text:'RFE response for Ravi Patel is due in 19 days',case:'ravi',read:false}],
    guide:{min:false,done:{}},clock:[10,30],flash:null,expanded:{},menu:null,modal:null};
}
let S=seed();let timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const C=id=>S.cases.find(c=>c.id===id);
const me=()=>ROLES[S.role];
function now(){S.clock[1]+=2;if(S.clock[1]>=60){S.clock[0]++;S.clock[1]-=60}return `Sep 26, ${S.clock[0]}:${String(S.clock[1]).padStart(2,'0')}`}
function log(c,who,what){c.activity.unshift({t:now(),who,what})}
function note(text,caseId){S.notes.unshift({id:Date.now()+Math.random(),text,case:caseId,read:false})}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=ic('check')+esc(msg);document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
function tick(n){if(!S.guide.done[n]){S.guide.done[n]=true}}
const ph=n=>S.phases?`<span class="phase">${PHASES[n]}</span>`:'';
const dotS=s=>`<span class="dot s${s}"></span>`;
const sname=s=>['Weak','Medium','Strong'][s];

/* ---------------- derived ---------------- */
function checklist(c){
  const claimed=c.criteria.filter(x=>x.claimed);
  const ready=claimed.filter(x=>x.status==='Ready').length;
  const gaps=claimed.filter(x=>/^Gap|Changes/.test(x.status)).length;
  const letters=c.letters.length?c.letters.every(l=>l.status==='Signed'):true;
  return [
    {k:'ready',label:'At least 3 criteria ready',done:ready>=3},
    {k:'gaps',label:'No open evidence gaps',done:gaps===0},
    {k:'letters',label:'All letters signed',done:letters},
    {k:'exhibits',label:'Exhibit list built',done:!!c.exhibits}
  ];
}
function evidenceCount(c){return c.criteria.filter(x=>x.claimed).reduce((a,x)=>a+x.docs.length,0)}

/* ---------------- render ---------------- */
function render(){
  const app=document.getElementById('app');
  app.className=S.collapsed?'collapsed':'';
  const pg=page();
  app.innerHTML=sidebar()+`<div class="main">${topbar()}<div class="content" id="content">${pg}</div></div>`;
  renderLayer();
}
function sidebar(){
  const r=S.role;const client=r==='client';
  const qn=queueItems().length;
  const items=client?[['portal','folder','My case']]:[['pipeline','board','Pipeline'],['queue','inbox','My queue'],['insights','chart','Insights'],['settings','sliders','Settings']];
  const cur=S.view.name==='case'?'pipeline':S.view.name;
  return `<aside class="sidebar"><div class="brand"><div class="logo">${ic('layers')}</div><span class="wordmark">CaseOS</span></div>
  <nav class="nav">${items.map(([k,i,l])=>`<button data-a="nav" data-v="${k}" class="${cur===k||client?'on':''}" title="${l}">${ic(i)}<span class="lbl">${l}</span>${k==='queue'&&qn?`<span class="count">${qn}</span>`:''}</button>`).join('')}</nav>
  ${guide()}
  <div class="sb-foot" style="position:relative">
    <button class="userbtn" data-a="rolemenu" title="Switch role">${av(me())}<span class="who"><b>${STAFF[me()][0]}</b><span>${STAFF[me()][1]} · switch role</span></span></button>
    <button class="userbtn" data-a="collapse" title="Collapse sidebar" style="margin-top:4px;color:var(--muted)">${ic('panel')}<span class="who"><span>Collapse</span></span></button>
  </div></aside>`;
}
function av(code,cls=''){return `<span class="av ${cls}" title="${STAFF[code]?STAFF[code][0]:''}">${code}</span>`}
function topbar(){
  const unread=S.notes.filter(n=>!n.read).length;
  if(S.role==='client')return `<header class="topbar"><span class="muted" style="font-size:13px">Client portal preview</span><div class="spacer"></div><button class="btn sm" data-a="reset">${ic('reset')}Reset demo</button></header>`;
  return `<header class="topbar">
   <button class="search" data-a="cmd">${ic('search')}<span>Search cases or ask the case agent</span><span class="kbd">Ctrl K</span></button>
   <div class="spacer"></div>
   <button class="toggle" data-a="phases" title="Tag each feature with its roadmap phase"><span class="sw ${S.phases?'on':''}"></span>Show build phases</button>
   <button class="iconbtn" data-a="notes" title="Notifications">${ic('bell')}${unread?`<span class="badge">${unread}</span>`:''}</button>
   <button class="btn sm" data-a="reset">${ic('reset')}Reset demo</button>
  </header>`;
}
function page(){
  if(S.role==='client')return portal();
  const v=S.view;
  if(v.name==='case')return casePage(C(v.id));
  if(v.name==='queue')return queuePage();
  if(v.name==='insights')return insights();
  return pipeline();
}

/* pipeline */
function pipeline(){
  let list=S.cases;
  if(S.filter==='mine')list=list.filter(c=>c.owner===me());
  if(S.filter==='risk')list=list.filter(c=>c.risk);
  if(S.visa!=='all')list=list.filter(c=>c.visa===S.visa);
  const risk=S.cases.filter(c=>c.risk).length;
  return `<div class="pagehead"><div><h1>Pipeline${ph(1)}</h1><p>Every case, its stage and its owner, in one place.</p></div></div>
  <div class="metrics">
   <div class="card metric"><div class="v">${S.cases.length}</div><div class="l">Active cases</div></div>
   <div class="card metric"><div class="v">${risk}</div><div class="l">At risk</div></div>
   <div class="card metric"><div class="v">94 days</div><div class="l">Median intake to filing</div></div>
   <div class="card metric"><div class="v">1</div><div class="l">RFE responses due in 30 days</div></div>
  </div>
  <div class="filters">
   ${[['all','All cases'],['mine','My queue'],['risk','At risk']].map(([k,l])=>`<button class="fchip ${S.filter===k?'on':''}" data-a="filter" data-v="${k}">${l}</button>`).join('')}
   <select class="fsel" data-a="visa" aria-label="Visa type">${['all','EB1A','O-1A','EB2-NIW'].map(v=>`<option value="${v}" ${S.visa===v?'selected':''}>${v==='all'?'All visa types':v}</option>`).join('')}</select>
  </div>
  <div class="board">${STAGES.map(([k,l])=>{const cs=list.filter(c=>c.stage===k);return `<div class="col"><div class="colh">${l}<span>${cs.length}</span></div>${cs.map(kcard).join('')||'<div class="empty">No cases</div>'}</div>`}).join('')}</div>`;
}
function kcard(c){
  return `<button class="kcard ${c.risk?'risk':''} ${S.flash===c.id?'flash':''}" data-a="open" data-v="${c.id}">
   <div class="top"><span class="nm">${esc(c.name)}</span>${av(c.owner,'sm')}</div>
   <div class="meta"><span class="chip">${c.visa}</span>${c.risk?`<span class="chip alert">${ic('alert')}${c.risk}</span>`:''}</div>
   <div class="st">${esc(c.status)} · ${c.stage==='rfe'?(c.rfe?c.rfe.left+' days left':''):c.days+'d in stage'}</div></button>`;
}

/* case page */
function tracker(c){
  const idx={intake:0,build:1,review:2,filing:3,rfe:3}[c.stage];
  return `<div class="card tracker">${TRACK.map((t,i)=>{const cls=i<idx?'done':i===idx?'cur':'';const lbl=(c.stage==='rfe'&&i===3)?'Filed · RFE response':t;return `${i?`<div class="tline ${i<=idx?'done':''}"></div>`:''}<div class="tstep ${cls}"><span class="c">${i<idx?ic('check'):''}</span>${lbl}</div>`}).join('')}${ph(1)}</div>`;
}
function casePage(c){
  if(c.id==='priya'&&S.role==='mei')tick(1);
  const tab=S.view.tab||'criteria';
  const set=SETS[c.visa];const claimed=c.criteria.filter(x=>x.claimed).length;
  return `<div class="crumb"><button data-a="nav" data-v="pipeline">Pipeline</button>${ic('chevR')}<span>${esc(c.name)}</span></div>
  <div class="casehead"><div><h1>${esc(c.name)}</h1><div class="chips"><span class="chip teal">${c.visa}</span>${c.premium?'<span class="chip">Premium processing</span>':''}${c.risk?`<span class="chip">${ic('alert')}${c.risk}</span>`:''}<span class="chip line">${set.rule} · claiming ${claimed}</span></div></div>
   <div class="owner"><div class="muted">Owner</div><div style="display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:4px">${av(c.owner,'sm')}<span><b>${STAFF[c.owner][0]}</b>, ${STAFF[c.owner][1]}</span></div>${c.next?`<div style="margin-top:6px"><span class="muted">Next:</span> <b>${esc(c.next)}</b></div>`:''}</div></div>
  ${tracker(c)}
  ${c.rfe?rfeBanner(c):''}
  <div class="layout"><div class="card">
    <div class="tabs">${[['criteria','Criteria'],['documents','Documents'],['letters','Letters'],['activity','Activity']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}${k==='letters'?ph(3):''}</button>`).join('')}</div>
    <div class="tabbody">${tab==='criteria'?criteriaTab(c):tab==='documents'?docsTab(c):tab==='letters'?lettersTab(c):activityTab(c)}</div>
  </div><div class="rail">${rail(c)}</div></div>`;
}
function reviewMode(c){return c.stage==='review'&&S.role==='diana'}
function criteriaTab(c){
  const rev=reviewMode(c);
  const showU=S.expanded[c.id+'_u'];const unc=c.criteria.filter(x=>!x.claimed);
  const ordered=[...c.criteria.filter(x=>x.claimed),...(showU?unc:[])];
  const rows=ordered.map(x=>{
    const open=S.expanded[c.id+x.key];
    const st=x.status;
    const stCls=st==='Ready'||st==='Not challenged'?'ok':(!x.claimed?'':'warn');

  return `<table><thead><tr><th>Criterion</th><th>Evidence</th><th>Strength</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>

/* queue */
function queueItems(){
  const code=me();const out=[];
  S.cases.forEach(c=>{if(c.owner===code)out.push({c,label:c.status,kind:'case'});c.tasks.forEach(t=>{if(t.owner===code)out.push({c,label:t.text,kind:'task'})})});

  return out;
}

  const pts=[131,128,127,122,119,116,112,108,104,100,97,94];const W=300,LH=120;

  return `<div class="pagehead"><div><h1>Insights${ph(5)}</h1><p>How we know it's working. Sample data.</p></div></div>
  <div class="igrid">
   <div class="card igroup"><h3>Leading indicators</h3><div class="sub">Checked weekly; they move before the outcome does.</div>

    <div class="kpi"><div class="l" style="margin-bottom:6px">Handoff wait time by stage, in days</div>${barSvg}</div>
    <div class="kpi"><div class="v">6.4 days</div><div class="l">Spent chasing documents per case, down from 11.2</div></div></div>
   <div class="card igroup"><h3>North star</h3><div class="sub">The outcome the business cares about.</div>
    <div class="kpi"><div class="v">94 days</div><div class="l">Median intake to filing, down from 131</div></div>
    <div class="kpi">${line}</div></div>
   <div class="card igroup"><h3>Guardrails</h3><div class="sub">Speed must never cost quality.</div>
    ${[['93%','Approval rate','Baseline 92%'],['18%','RFE rate','Baseline 19%'],['12%','Criteria sent back by attorneys','Baseline 15%']].map(k=>`<div class="kpi"><div class="v">${k[0]}</div><div class="l">${k[1]} · <span style="color:var(--teal);font-weight:500">holding</span> · ${k[2]}</div></div>`).join('')}</div>

/* command bar */
const QS=[['block','What\'s blocking the handoff?'],['weak','Which criteria are weakest?'],['orig','Summarise the evidence for original contributions']];
function cmdbar(){
  const q=(S.cmd.q||'').toLowerCase();
  const res=S.cases.filter(c=>!q||c.name.toLowerCase().includes(q)).slice(0,6);
  const onCase=S.view.name==='case'&&S.role!=='client';
  return `<div class="cmd" data-a="cmdclose"><div class="cmdbox" data-a="stop"><input id="cmdin" placeholder="${onCase?'Search cases or ask about '+esc(C(S.view.id).name):'Search cases by client name'}" autocomplete="off">
   ${onCase?`<div class="cmdsec"><div class="h">Ask the case agent</div>${QS.map(([k,l])=>`<button data-a="ask" data-v="${k}"><span class="agentid">${ic('spark')}</span>${l}</button>`).join('')}</div>`:''}
   ${S.cmd.answer!=null?`<div class="answer"><div id="ans">${esc(S.cmd.shown||'')}</div>${S.cmd.done?`<div class="srcs">${S.cmd.srcs.map(s=>`<span class="chip">${ic('file')}${esc(s)}</span>`).join('')}</div>`:''}</div>`:''}
   <div class="cmdsec"><div class="h">Cases</div>${res.map((c,i)=>`<button data-a="open" data-v="${c.id}" class="${i===0&&q?'act':''}">${av(c.owner,'sm')}<span class="serif" style="font-weight:600">${esc(c.name)}</span><span class="chip">${c.visa}</span><span class="muted" style="margin-left:auto;font-size:12px">${STAGES.find(s=>s[0]===c.stage)[1]}</span></button>`).join('')||'<div class="empty">No matching cases</div>'}</div></div></div>`;
}
function answerFor(k,c){
  if(k==='block'){if(c.stage!=='build')return [`${c.name} isn't in case build, so there's no handoff to the attorney pending. Current stage: ${STAGES.find(s=>s[0]===c.stage)[1]}.`,['Case record']];
    const m=checklist(c).filter(x=>!x.done);return [m.length?`${m.length} thing${m.length>1?'s are':' is'} blocking the handoff: ${m.map(x=>x.label.toLowerCase()).join('; ')}. ${m.find(x=>x.k==='gaps')?'The gap is in leading or critical role; uploading the org chart and CTO letter would close it. ':''}${m.find(x=>x.k==='letters')?'Dr. L. Brooks is the only unsigned letter. ':''}`:'Nothing is blocking the handoff. The checklist is complete, so you can send it to attorney review.',['Handoff checklist','Letters tracker']];}
  if(k==='weak'){const cl=c.criteria.filter(x=>x.claimed).sort((a,b)=>a.strength-b.strength);return [`Weakest first: ${cl.slice(0,2).map(x=>`${x.name} (${sname(x.strength).toLowerCase()}, ${x.docs.length} item${x.docs.length>1?'s':''}, ${x.status.toLowerCase()})`).join('; ')}. The strongest is ${cl[cl.length-1].name.toLowerCase()} with ${cl[cl.length-1].docs.length} items.`,cl.slice(0,2).map(x=>x.name)];}
  const o=c.criteria.find(x=>x.key==='original');if(!o||!o.claimed)return ['This case doesn\'t claim original contributions.',[]];
  const lt=c.letters.filter(l=>l.crit.startsWith('Original'));
  return [`Original contributions has ${o.docs.length} items: ${o.docs.map(d=>d.name.replace(/_/g,' ').replace(/\.\w+$/,'')).join(', ')}.${lt.length?` It's supported by ${lt.length} letter${lt.length>1?'s':''}: ${lt.map(l=>`${l.name} (${l.status.toLowerCase()})`).join(', ')}.`:''} Current strength: ${sname(o.strength).toLowerCase()}.`,o.docs.slice(0,2).map(d=>d.name)];
}
function stream(text,srcs){
  S.cmd.answer=text;S.cmd.shown='';S.cmd.done=false;S.cmd.srcs=srcs;renderLayer();
  const words=text.split(' ');let i=0;
  const step=()=>{if(!S.cmd)return;i++;S.cmd.shown=words.slice(0,i).join(' ');const a=document.getElementById('ans');if(a)a.textContent=S.cmd.shown;if(i<words.length)later(step,28);else{S.cmd.done=true;renderLayer()}};
  later(step,250);
}

/* ---------------- agent runs ---------------- */
function animate(steps,done){
  S.modal.steps=steps;S.modal.at=0;S.modal.step='run';render();

function startUpload(files){
  S.modal={type:'upload',case:'priya',step:'pick',files};
  animate([`Reading ${files.length} files`,'Extracting text','Classifying documents','Mapping to criteria'],()=>{
    const R={'Org_chart_Acme_Robotics.pdf':['Org chart','Leading or critical role',94,'leading'],'CTO_letter_Acme_Robotics.pdf':['Support letter','Leading or critical role',91,'leading'],'Passport_scan.jpg':['Identity document','Identity (not evidence)',98,'identity'],'Conference_photo.jpg':['Photo, unclear','No clear match',58,'review']};
    S.modal.results=files.map(f=>({file:f,type:R[f][0],target:R[f][1],conf:R[f][2],dest:R[f][3]}));S.modal.step='results';

function applyMapping(accept){
  const c=C('priya');const res=S.modal.results;let n=0;
  res.forEach(r=>{
    if(r.dest==='review'){c.needsReview.push({name:r.file});return}
    if(!accept(r))return;n++;
    const lg=lin('Upload by Mei Chen',r.dest==='leading'?(r.file.startsWith('Org')?'Title: Head of ML Platform; reports to: CTO; team: 14 engineers':'Author: CTO, Acme Robotics; describes role as critical to product launch'):'Passport number and expiry (restricted)',`${r.target} · High ${r.conf}%`,'Mei Chen · '+`${S.clock[0]}:${String(S.clock[1]).padStart(2,'0')}`);
    if(r.dest==='identity')c.identity.push({name:r.file});
    else{const x=c.criteria.find(k=>k.key===r.dest);x.docs.push({name:r.file,lineage:lg})}
  });
  const lead=c.criteria.find(k=>k.key==='leading');
  if(lead.docs.length>=3&&lead.strength===0){lead.strength=1;lead.status='Ready'}
  c.requests.forEach(r=>r.status='Received');
  const gap=c.feed.find(f=>f.id==='gap');if(gap&&gap.state==='open'){gap.state='done';gap.doneText='Evidence gap closed for leading or critical role'}
  log(c,'Mei Chen',`Approved the agent's mapping for ${n} file${n!==1?'s':''}`);
  if(!c.feed.find(f=>f.id==='exhibits')&&checklist(c).find(x=>x.k==='gaps').done)c.feed.push({id:'exhibits',state:'open',fresh:true,title:'Evidence looks complete. Build the exhibit list?',body:`${evidenceCount(c)} evidence items across ${c.criteria.filter(x=>x.claimed).length} criteria. I'll order them by criterion and number them for the petition.`,conf:'',srcs:['Criteria matrix'],primary:'Build exhibit list'});
  S.modal=null;tick(2);toast('Mapping approved');render();
}

 resolve(v){const c=C(S.view.id);const x=c.criteria.find(k=>k.key===v);x.status='Ready';x.comment=null;log(c,'Mei Chen','Resolved the attorney\'s comment on '+x.name);c.exhibits=false;c.feed=c.feed.filter(f=>!(f.id==='exhibits'&&f.state==='done'));if(!c.feed.find(f=>f.id==='exhibits'&&f.state==='open'))c.feed.push({id:'exhibits',state:'open',fresh:true,title:'Rebuild the exhibit list?',body:'Evidence changed since the attorney\'s review, so the exhibit numbering needs refreshing.',conf:'',srcs:['Criteria matrix'],primary:'Build exhibit list'});toast('Marked resolved')},
 reopen(){const c=C(S.view.id);c.rfe.reopened=true;c.criteria.forEach(x=>{if(!x.claimed)return;const hit=c.rfe.requests.find(q=>q.crit===x.key);x.status=hit?'Reopened':'Not challenged';if(hit){c.tasks.push({owner:c.owner,text:'Add RFE evidence for '+x.name})}});log(c,'Mei Chen','Reopened '+c.rfe.requests.length+' criteria challenged by the RFE (parsed by Case agent)');toast('2 criteria reopened; tasks added to the queue')},
 clientup(v){const c=C('priya');c.requests[+v].status='Received';if(c.requests.every(r=>r.status==='Received')&&!c.feed.find(f=>f.id==='clientfiles')){c.feed.unshift({id:'clientfiles',state:'open',fresh:true,title:'Priya uploaded 2 files. Classify and map them?',body:'The org chart and CTO letter you requested have arrived through the client portal.',conf:'',srcs:['Client portal'],primary:'Classify files'});note('Priya Sharma uploaded the requested documents','priya')}log(c,'Priya Sharma','Uploaded '+c.requests[+v].name);toast('Uploaded. Your case team has been notified.')},
 visa(v,el){S.visa=el.value}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(S.menu){S.menu=null;renderLayer()}return}
  const a=el.dataset.a;
  if(a==='stop'){e.stopPropagation();return}
  if(el.tagName==='SELECT'||el.tagName==='INPUT'&&a!=='cmdin')return;
  if(a==='overlay'&&e.target!==el)return;
  if(a==='cmdclose'&&e.target!==el)return;
  if(el.hasAttribute('disabled'))return;
  if(!A[a])return;
  const r=A[a](el.dataset.v,el);
  if(r==='keep'||r==='nor')return;
  render();
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='visa'||a==='assign'){A[a](el.dataset.v,el);render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='cmdin'){S.cmd.q=el.value;const pos=el.selectionStart;S.cmd.focused=false;renderLayer();const n=document.getElementById('cmdin');n.setSelectionRange(pos,pos)}else if(el.dataset&&el.dataset.a==='reqedit'){A.reqedit(el.dataset.v,el)}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.cmd();render()}
  if(e.key==='Escape'){if(S.cmd)S.cmd=null;else if(S.modal&&S.modal.step!=='run')S.modal=null;else S.menu=null;renderLayer()}
  if(e.key==='Enter'&&S.cmd&&document.activeElement.id==='cmdin'){const q=S.cmd.q.toLowerCase();const c=S.cases.find(c=>c.name.toLowerCase().includes(q));if(q&&c){A.open(c.id);render()}}
});
render();
</script>
</body>
</html>
